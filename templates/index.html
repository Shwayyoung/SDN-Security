<!DOCTYPE html>
<html>
<head>
    <title>SDN Network Manager</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="text-center mb-5">
        <h1>SDN Network Manager</h1>
        <p class="text-muted">
            Floodlight Static Flow Management
        </p>
    </div>

    <div class="row justify-content-center">

        <div class="col-md-4">
            <div class="card shadow p-4 text-center">
                <h3>Static Routing</h3>

                <p>
                    Configure OpenFlow static forwarding rules.
                </p>

                <a
                    href="/routing"
                    class="btn btn-primary"
                >
                    Open Static Routing
                </a>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow p-4 text-center">
                <h3>Firewall</h3>

                <p>
                    Configure selective access control rules.
                </p>

                <a
                    href="/firewall"
                    class="btn btn-danger"
                >
                    Open Firewall
                </a>
            </div>
        </div>

    </div>

</div>

</body>
</html>
